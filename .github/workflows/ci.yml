name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          push: false
          tags: voxraft-app:${{ github.sha }}
      - name: Package production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save voxraft-app:${{ github.sha }} | gzip -6 > /tmp/voxraft-image.tar.gz
      - name: Upload production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: production-image
          path: /tmp/voxraft-image.tar.gz
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, voxraft-prod]
    needs: container
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: production-image
          path: ${{ runner.temp }}/voxraft-image
      - name: Deploy verified image
        run: sudo --non-interactive /usr/local/sbin/deploy-voxraft "$GITHUB_SHA" "$RUNNER_TEMP/voxraft-image/voxraft-image.tar.gz"
