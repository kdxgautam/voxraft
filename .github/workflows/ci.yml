name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production container
        run: docker build --tag voxraft-app:${{ github.sha }} .
      - name: Smoke test production container
        run: |
          VOXRAFT_CONTAINER="$(docker run --detach \
            --publish 127.0.0.1:8000:8000 \
            --env AUTH_SECRET_KEY=ci-only-auth-secret-not-for-production-1234567890 \
            voxraft-app:${{ github.sha }})"
          trap 'docker rm --force "$VOXRAFT_CONTAINER" >/dev/null 2>&1 || true' EXIT
          for VOXRAFT_ATTEMPT in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$VOXRAFT_CONTAINER"
          exit 1
