name: Repair production SSH

on:
  workflow_dispatch:

permissions: {}

jobs:
  allow-current-ip:
    name: Allow current operator IP
    runs-on: [self-hosted, linux, x64, voxraft-prod]
    environment: production
    timeout-minutes: 2
    steps:
      - name: Inspect maintenance access
        run: |
          if [[ -w /opt/voxraft/.env.production ]]; then
            echo "runtime-env=writable"
          else
            echo "runtime-env=not-writable"
          fi
          sudo --non-interactive --list || true
