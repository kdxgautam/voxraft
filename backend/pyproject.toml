[project]
name = "bolcanvas-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "gnani-vachana>=0.9.0",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
