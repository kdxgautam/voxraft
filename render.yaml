services:
  - type: web
    name: voxraft
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_MODEL
        value: prisma-v3.0
      - key: GNANI_STREAM_MODEL
        value: prisma-v3.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
